[project]
name = "papillarray"
version = "0.1.0"
description = "Robust learning-based incipient slip detection using the PapillArray optical tactile sensor (official implementation, uv + Python 3.12 fork)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.11",
    "torch==2.10.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["papillarray"]

# torch 固定走 cu128 源（配合本机缓存的 torch 2.10.0+cu128 轮子，RTX 4070 / 驱动 CUDA 13.0 兼容）。
# 改用 CPU 版：删掉下面 [tool.uv.sources] 中 torch 一行，再 `uv sync`（torch==2.10.0 回落到 PyPI CPU 轮子）。

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
